name: test

on:
  push:
    branches:
      - "main"
      - "master"
      - "dev"
    paths:
      - "**.py"
      - ".github/workflows/*test*.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/*test*.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  test:
    name: "test Python ${{ matrix.python }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: "macos-latest"
            python: "3.11"
          - os: "windows-latest"
            python: "3.11"
    defaults:
      run:
        shell: "bash -eo pipefail {0}"

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python }}"
          allow-prereleases: true
      - run: "python --version"
      - run: "python -m pip install -U pip"
      - run: "python -m pip install -e ./[test,dev]"
      - run: "ruff check ."
      - run: "ruff format --check ."
      - name: "Run tests"
        run: "python -m pytest -vv --durations=10 --cov=multimetricdiagram --cov-report=term-missing --cov-report=xml"
      - name: "Upload coverage to Codecov"
        if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: "codecov/codecov-action@v5"
        with:
          files: "coverage.xml"
          token: "${{ secrets.CODECOV_TOKEN }}"
          fail_ci_if_error: false
